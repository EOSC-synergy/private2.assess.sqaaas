config:
  credentials:
  - id: https://github.com/PalomoIFCA/private2
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/private2:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/PalomoIFCA/private2
      repo: https://github.com/PalomoIFCA/private2
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/private2 git:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_careful_spider.sh
        container: qc.acc_jade_funny_shark
  QC.Doc:
    repos:
      github.com/PalomoIFCA/private2 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.ginger_dramatic_goat.sh
        container: qc.doc_aqua_rustic_flounder
      github.com/PalomoIFCA/private2 git:
        commands:
        - /usr/bin/env sh .sqa/script.lemon_shrewd_bat.sh
        container: qc.doc_glacier_lucky_rattlesnake
      github.com/PalomoIFCA/private2 markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.poppy_delighted_wolf.sh
        container: qc.doc_plum_melancholy_manatee
  QC.Lic:
    repos:
      github.com/PalomoIFCA/private2 licensee:
        commands:
        - /usr/bin/env sh .sqa/script.glaucous_skeptical_lemur.sh
        container: qc.lic_saffron_grumpy_quokka
  QC.Met:
