        - /usr/bin/env sh .sqa/script.reef_radiant_rhinoceros.sh
        container: qc.doc_raven_confident_moth
      github.com/PalomoIFCA/private2 git:
        commands:
        - /usr/bin/env sh .sqa/script.chartreuse_vigilant_wolverine.sh
        container: qc.doc_lemon_cheerful_angelfish
      github.com/PalomoIFCA/private2 markdownlint:
