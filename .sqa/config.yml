config:
  credentials:
  - id: https://github.com/PalomoIFCA/private2
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/private2:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/PalomoIFCA/private2
      repo: https://github.com/PalomoIFCA/private2
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/private2 git:
        commands:
        - /usr/bin/env sh .sqa/script.olive_sarcastic_spren.sh
        container: qc.acc_jet_hardworking_uakari
  QC.Doc:
    repos:
      github.com/PalomoIFCA/private2 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_bold_termite.sh
        container: qc.doc_denim_dedicated_dolphin
      github.com/PalomoIFCA/private2 git:
        commands:
        - /usr/bin/env sh .sqa/script.lime_whimsical_chameleon.sh
        container: qc.doc_khaki_rustic_barracuda
      github.com/PalomoIFCA/private2 markdownlint:
